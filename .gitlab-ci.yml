stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  # Define image names for clarity
  IMAGE_TAG_API: "$CI_REGISTRY_IMAGE/api:latest"
  IMAGE_TAG_UI: "$CI_REGISTRY_IMAGE/ui:latest"

services:
  - name: docker:24-dind
    command: ["--tls=false"]

build:
  stage: build
  image: docker:24
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    # --- 1. BACKEND ---
    - echo "Building Backend..."
    - docker build -t $IMAGE_TAG_API ./back
    - docker push $IMAGE_TAG_API

    # --- 2. FRONTEND ---
    - echo "Building Frontend..."
    # IMPORTANT: We must bake the API URL into the Next.js image at build time
    - docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $IMAGE_TAG_UI ./front
    - docker push $IMAGE_TAG_UI
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    # 1. Send the PRODUCTION compose file (renaming it to docker-compose.yml on destination)
    - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SSH_USER@$SSH_HOST:~/PartCraft/docker-compose.yml

    # 2. SSH in to restart
    - |
      ssh $SSH_USER@$SSH_HOST "
        cd ~/PartCraft &&
      
        # Login to GitLab Registry so the server can download the private images
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&

        # Set Server-Side Environment Variables
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        export MYSQL_ROOT_PASSWORD='root'
        export JWT_SECRET=\"$JWT_SECRET\"
        export GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\"
        export GOOGLE_CLIENT_SECRET=\"$GOOGLE_CLIENT_SECRET\"
        export NEXT_PUBLIC_API_URL=\"$NEXT_PUBLIC_API_URL\"

        # Pull the new images
        docker compose pull &&

        # Restart everything (removes old containers automatically)
        docker compose up -d --remove-orphans
      "
  only:
    - main