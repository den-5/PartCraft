services:
  mysql:
    image: mysql:8.4
    container_name: partcraft-db
    restart: always
    # Use variables passed from CI/CD
    environment:
      MYSQL_ROOT_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      MYSQL_DATABASE: "part-craft"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - partcraft-network

  redis:
    image: redis:7-alpine
    container_name: partcraft-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - partcraft-network

  api:
    # Use lowercase project path for the image name
    image: registry.gitlab.com/den-5/partcraft/api:latest
    container_name: partcraft-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # Database Configs (Read from variables exported in CI)
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"
      
      # Redis Configs (Read from variables/defaults in application.properties)
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      
      # Security Configs (Read from variables exported in CI)
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      # The rest of the Google Auth URIs default correctly in application.properties
      
    networks:
      - partcraft-network

volumes:
  mysql_data:

networks:
  partcraft-network:
    driver: bridge