spring.application.name=BackApplication
frontend.url=${FRONTEND_URL:http://localhost:3000}
# ============================
# SECURITY / COOKIES
# ============================
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.access-token-max-age=${COOKIE_ACCESS_TOKEN_MAX_AGE:1800}
app.cookie.refresh-token-max-age=${COOKIE_REFRESH_TOKEN_MAX_AGE:86400}
# ============================
# CORS
# ============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# ============================
# DATABASE (MYSQL, ALL ENVIRONMENTS)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/part-craft?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# ============================
# SERVER
# ============================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET:41ded1bd3cbd33c216038999ffabf25b339bfbdaeab864962404a466d6b8b0e2b230637ab08eaf2090d9c8aa23f8ffc397bece2f03c8659f34a51a8fc3380316}
jwt.jwtExpirationMs=${JWT_EXPIRATION_MS:1800000}
jwt.refreshTokenExpirationInMs=${JWT_REFRESH_EXPIRATION_MS:86400000}
# ============================
# REDIS
# ============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}
# Google OAuth2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/auth}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
spring.security.oauth2.client.provider.google.user-name-attribute=${GOOGLE_USER_NAME_ATTRIBUTE:sub}
# ============================
# SPRINGDOC OPENAPI / SWAGGER
# ============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

