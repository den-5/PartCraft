spring.application.name=BackApplication
# ============================
# DATABASE (MYSQL, ALL ENVIRONMENTS)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ============================
# SERVER
# ============================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET:b93e6c1c588d97ca2f7dbc938c7ccd461668f1ad0a390a9f2b77bf3aa8fa8bb4a319c74c5d250f02288b7ebac581edf077d93e677bce8faf368c2e8ffbb9e185}
jwt.jwtExpirationMs=${JWT_EXPIRATION_MS:1800000}
jwt.refreshTokenExpirationInMs=${JWT_REFRESH_EXPIRATION_MS:86400000}
# ============================
# REDIS
# ============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}
# Google OAuth2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/auth}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
spring.security.oauth2.client.provider.google.user-name-attribute=${GOOGLE_USER_NAME_ATTRIBUTE:sub}
