spring.application.name=BackApplication
# ============================
# DATABASE (TEST = H2)
# ============================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# ============================
# SERVER
# ============================
server.port=0
server.address=127.0.0.1
# Allow test overrides
spring.main.allow-bean-definition-overriding=true
# ============================
# JWT (Safe test values)
# ============================
jwt.secret.key=testSecretKeyForIntegrationTestsOnly1234567890
jwt.access.token.expiration.milliseconds=3600000
jwt.refresh.token.expiration.milliseconds=86400000
