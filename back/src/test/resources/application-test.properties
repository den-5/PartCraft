spring.application.name=BackApplication
# ============================
# DATABASE (Testcontainers MySQL)
# ============================
# Will be overridden by Testcontainers DynamicPropertySource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================
# JPA
# ============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ============================
# REDIS (Testcontainers Redis)
# ============================
# Will be overridden by Testcontainers DynamicPropertySource
# ============================
# SERVER
# ============================
server.port=0
server.address=127.0.0.1
# Allow test overrides
spring.main.allow-bean-definition-overriding=true
# ============================
# JWT (Safe test values)
# ============================
jwt.secret=VGhpcyBJcyBBIFZlcnkgTG9uZyBTZWNyZXQgS2V5IFRoYXQgU2F0aXNmaWVzIFRoZSBIUzUxMiBTZWN1cml0eSBSZXF1aXJlbWVudHMxMjM0NTY
jwt.access.token.expiration.milliseconds=3600000
jwt.refresh.token.expiration.milliseconds=86400000
